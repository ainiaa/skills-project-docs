<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>设备预约 · 合成设计基线</title>
<style>
:root{--brand:#2457A7;--info:#2457A7;--warning:#8A4B08;--text:#172C3E;--muted:#526575;--surface:#FFF;--background:#F3F5F7;--card-padding:16px;font-family:system-ui,sans-serif;color:var(--text);background:var(--background)}
*{box-sizing:border-box}body{margin:0}header{padding:16px 24px;background:var(--surface);border-bottom:1px solid #DCE3E3}h1{font-size:24px;margin:0 0 8px}nav{display:flex;gap:16px;flex-wrap:wrap}nav [aria-current]{color:var(--brand);font-weight:700;border-bottom:2px solid var(--brand)}main{max-width:1000px;margin:24px auto;padding:0 16px}.card{padding:var(--card-padding);background:var(--surface);border:1px solid #DCE3E3;border-radius:8px;margin:16px 0;overflow-wrap:anywhere}h2{font-size:18px;margin:0 0 12px}button{font:inherit;border-radius:6px;padding:10px 16px;cursor:pointer}.primary{background:var(--brand);border:1px solid var(--brand);color:white}.secondary{background:white;border:1px solid var(--brand);color:var(--brand)}button:disabled{background:#E5E7EB;border-color:#CBD2DA;color:#526575;cursor:not-allowed}:focus-visible{outline:3px solid #8A4B08;outline-offset:3px}.status{font-weight:600}.confirmed{color:var(--brand)}.cancelled{color:var(--muted)}.warning{color:var(--warning)}a{color:var(--info)}label{display:block;font-weight:600;margin-bottom:8px}input{max-width:100%;font:inherit;padding:10px;border:1px solid #68798A;border-radius:6px}.error{color:#A61B1B}small{color:var(--muted)}
</style>
<header><h1>设备预约</h1><small>合成设计基线 · 静态展示，非已实现原型</small><nav aria-label="业务导航"><span aria-current="page">我的预约</span><span>全部预约</span></nav></header>
<main><button class="primary" type="button">新建预约</button><section class="card"><h2>投影仪A</h2><p>2026-11-02　13:00—14:00</p><p class="status confirmed">已确认</p><button class="secondary" type="button">查看详情</button></section><section class="card"><h2>详情及反馈样式示意</h2><p class="status cancelled">已取消</p><p class="warning">演示时钟变化可能影响取消资格</p><label for="reason">预约理由</label><input id="reason" aria-describedby="error"><p id="error" class="error">请填写预约理由，输入将保留以便修改。</p><button class="primary" type="button">保存预约</button> <button disabled type="button">当前不可取消</button><p><a href="#">查看说明（信息色）</a></p></section></main></html>
