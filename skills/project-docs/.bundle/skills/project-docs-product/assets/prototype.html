  <title>需求原型模板</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#172c3e;background:#f3f5f5}body{max-width:960px;margin:40px auto;padding:0 24px}header{border-bottom:2px solid #176b59;padding-bottom:24px}section{background:white;padding:24px;margin-top:24px;border:1px solid #dce3e3;border-radius:8px}button{font:inherit;padding:10px 16px;background:#176b59;color:white;border:0;border-radius:4px}button:focus-visible,a:focus-visible{outline:3px solid #d18c24;outline-offset:3px}small{color:#526575}

<body>
  <header><small>交互原型 · 模拟数据 · draft-1</small><h1>需求原型模板</h1><p>先根据 PRD 的流程覆盖表确定完整用户任务、角色交接和结束结果，再重写全部内容。这里尚未实现业务交互，不可作为已验收原型交付。</p></header>
  <main>
    <section data-requirement="FR-001"><h2>任务入口、交接与结果</h2><p>按实际需求拆出入口、跨页面步骤、角色交接、结果与异常恢复；多视图共享同一业务对象。只有用户明确要求时才交付局部交互验证。</p><button data-scenario="AC-001" disabled>待实现的旅程入口</button></section>
    <section><h2>评审说明</h2><p>展示未决规则、模拟范围及关联 PRD。不要把模板中的编号或文字当成实际业务。</p></section>
  </main>
</body>
