name: Product deterministic checks

on:
  push:
  pull_request:

jobs:
  product:
    runs-on: ubuntu-24.04
    env:
      UNDERSTAND_RENDERER_HOME: ${{ github.workspace }}/.renderers/product
      PRODUCT_SCREENSHOT_DIR: ${{ github.workspace }}/.product-screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public docs and installation links from the checkout
        run: python3 -m unittest discover -s scripts -p test_public_docs.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned product Markdown parser
        run: python3 -m pip install -r scripts/requirements-product.txt
      - name: Install the existing coverage test tools
        run: python3 -m pip install pytest==8.4.2 pytest-cov==7.0.0
      - name: Reuse the existing Mermaid browser runtime
        run: |
          python3 scripts/install_renderers.py --engine mermaid
          # The hosted Ubuntu runner blocks Chromium's sandbox. Scope the flag to CI.
          config="$RUNNER_TEMP/mermaid-puppeteer-product.json"
          wrapper="$RUNNER_TEMP/mmdc-product"
          printf '%s\n' '{"args":["--no-sandbox"]}' > "$config"
          printf '#!/bin/sh\nexec "%s" --puppeteerConfigFile "%s" "$@"\n' \
            "$UNDERSTAND_RENDERER_HOME/bin/mmdc" "$config" > "$wrapper"
          chmod +x "$wrapper"
          printf 'MERMAID_OFFICIAL_CLI=%s\n' "$wrapper" >> "$GITHUB_ENV"
      - name: Diagnose the headless browser before contract tests
        run: node scripts/product_browser.mjs --doctor
      - name: Verify release specialties beyond Product and Lifecycle coverage
        run: env PYTHONPATH=scripts python3 -m unittest scripts.test_install scripts.test_update scripts.test_product_npx_installer scripts.test_native_diagrams scripts.test_archify_native_types scripts.test_generate_api_docs
      - name: Product contracts, frozen fixtures and installation regressions
        run: |
          python3 scripts/build_npx_bundles.py --check
          npx -y skills@1.7.6 --version
          PROJECT_DOCS_NPX_TEST=1 python3 -m unittest scripts.test_npx_install
          python3 -m unittest discover -s scripts -p test_coverage_scope.py
          python3 -m pytest scripts/test_product_docs.py scripts/test_product_split.py scripts/test_product_dependencies.py scripts/test_product_bundle.py scripts/test_product_behavior_eval.py scripts/test_product_handoff.py scripts/test_product_evidence.py scripts/test_product_inputs.py scripts/test_product_revision.py scripts/test_product_npx_installer.py scripts/test_lifecycle_record.py scripts/test_lifecycle_relations.py scripts/test_lifecycle_quality.py scripts/test_lifecycle_handoff.py scripts/test_lifecycle_checklist.py --cov --cov-fail-under=90
          python3 -m unittest discover -s evals/product -p 'test_*.py'
          env PYTHONPATH=scripts python3 -m unittest scripts.test_lifecycle_delivery scripts.test_lifecycle_pilot scripts.test_engineering_handoff
          python3 -m unittest discover -s scripts -p test_install_product_dependencies.py
      - name: Record model behavior verification boundary
        run: |
          python3 - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Model behavior and actual authored artifact trials: **not run / uncovered** in deterministic CI. Release acceptance requires both fresh reports in their original upstream environment: `python3 scripts/product_behavior_eval.py --release --report <behavior.json> --artifacts <artifacts.json>`. The 90% coverage gate covers the canonical Product and Lifecycle modules declared in `.coveragerc`, not the whole repository.\n')
          PY
      - name: Validate the example PRD and interactive prototype
        run: |
          python3 scripts/validate_product_doc.py --file skills/project-docs-product/assets/examples/prd.md --prototype skills/project-docs-product/assets/examples/prototype.html
          python3 scripts/validate_product_doc.py --file skills/project-docs-product/assets/examples/access-request/prd.md --prototype skills/project-docs-product/assets/examples/access-request/prototype.html
      - name: Run actual browser interactions
        run: |
          node --test scripts/test_product_runtime.mjs
          node --test scripts/test_product_browser.mjs
          node scripts/product_browser.mjs --directory skills/project-docs-product/assets/examples/access-request --test journey.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-prototype-screenshots
          path: |
            ${{ env.PRODUCT_SCREENSHOT_DIR }}
            skills/project-docs-product/assets/examples/access-request/evidence
          if-no-files-found: ignore
